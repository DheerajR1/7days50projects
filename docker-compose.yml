services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobs
    ports: ["5432:5432"]
    volumes:
      - ./infra/migrations:/docker-entrypoint-initdb.d

  api-service:
    build: ./api
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/jobs
    ports: ["8000:8000"]
    depends_on: [redis, postgres]

  worker-service:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/jobs
      WORKER_ID: worker-${HOSTNAME}
      WORKER_IP: worker-service
      MAX_CAPACITY: 2
    depends_on: [redis, postgres]
    deploy:
      replicas: 2

  dashboard:
    build: ./dashboard
    ports: ["5173:5173"]
    depends_on: [api-service]
